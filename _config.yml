# Welcome to Jekyll!
#
# This config file contains settings that affect your entire site.
# This file is NOT reloaded automatically when using:
# bundle exec jekyll serve -l -H localhost
#
# After changing this file, stop the server with Ctrl+C and restart it.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"

title                    : "Hiba Dahmani"
title_separator          : "-"
name                     : &name "Hiba Dahmani"
description              : &description "PhD candidate in Computer Vision researching scalable 3D scene reconstruction and generation using diffusion models and neural 3D representations."

url: "https://dahmanihiba.github.io"
baseurl: ""
repository: "dahmanihiba/dahmanihiba.github.io"

# Site Author
author:
  # Biographic information
  avatar           : "profile.jpg"
  name             : "Hiba Dahmani"
  pronouns         :
  bio              : "PhD candidate in Computer Vision, researching diffusion models, neural rendering, and 3D representations for scalable 3D scene generation."
  location         : "Paris, France"
  employer         : "Huawei Paris Research Center & COSYS, Gustave Eiffel University"
  uri              :
  email            : "dahmani31hiba@gmail.com"

  # Academic websites
  academia         :
  arxiv            :
  googlescholar    : "https://scholar.google.com/citations?user=jJnBqj0AAAAJ&hl=en"
  inspire-hep      :
  impactstory      :
  orcid            :
  semantic         :
  ssrn             :
  pubmed           :
  researchgate     :
  scopus           :
  zotero           :

  # Repositories and software development
  bitbucket        :
  codepen          :
  dribbble         :
  github           : "dahmanihiba"
  kaggle           :
  stackoverflow    :

  # Social media
  artstation       :
  bluesky          :
  facebook         :
  flickr           :
  foursquare       :
  goodreads        :
  google_plus      :
  keybase          :
  instagram        :
  lastfm           :
  linkedin         : "hiba-dahmani-71606b192"
  mastodon         :
  medium           :
  pinterest        :
  soundcloud       :
  steam            :
  telegram         :
  tumblr           :
  twitter          :
  vine             :
  weibo            :
  wikipedia        :
  xing             :
  youtube          :
  zhihu            :


# Publication Categories
publication_category:
  books:
    title: "Books"
  manuscripts:
    title: "Journal Articles"
  conferences:
    title: "Conference Papers"


# Site Settings
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

comments:
  provider               :

  disqus:
    shortname            :

  discourse:
    server               :

  facebook:
    appid                :
    num_posts            :
    colorscheme          :


# Staticman Comments
staticman:
  allowedFields:
    - name
    - email
    - url
    - message

  branch                 : "gh-pages"
  commitMessage          : "New comment."
  filename               : "comment-{@timestamp}"
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"

  requiredFields:
    - name
    - email
    - message

  transforms:
    email                : "md5"

  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601"


# Atom Feed
atom_feed:
  hide                   : false
  path                   :


# SEO Verification
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :


# Social Sharing
twitter:
  username               : &twitter

facebook:
  username               :
  app_id                 :
  publisher              :

og_image                 : "profile.jpg"
og_description           : *description


# Structured Social Profiles
social:
  type                   : "Person"
  name                   : "Hiba Dahmani"
  links:
    - "https://github.com/dahmanihiba"
    - "https://linkedin.com/in/hiba-dahmani-71606b192"
    - "https://scholar.google.com/citations?user=jJnBqj0AAAAJ&hl=en"


# Analytics
analytics:
  provider               : false

  google:
    tracking_id          :


# Reading Files
include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding                 : "utf-8"
markdown_ext             : "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown                 : kramdown
highlighter              : rouge
lsi                      : false
excerpt_separator        : "\n\n"
incremental              : false


# Markdown Processing
kramdown:
  input                  : GFM
  hard_wrap              : false
  auto_ids               : true
  footnote_nr            : 1
  entity_output          : as_char
  toc_levels             : 1..6
  smart_quotes           : lsquo,rsquo,ldquo,rdquo
  enable_coderay         : false


# Collections
collections:
  teaching:
    output               : true
    permalink            : /:collection/:path/

  publications:
    output               : true
    permalink            : /:collection/:path/

  portfolio:
    output               : true
    permalink            : /:collection/:path/

  talks:
    output               : true
    permalink            : /:collection/:path/


# Default Page Settings
defaults:
  # Posts
  - scope:
      path               : ""
      type               : posts
    values:
      layout             : single
      author_profile     : true
      read_time          : true
      comments           : true
      share              : true
      related            : true

  # Pages
  - scope:
      path               : ""
      type               : pages
    values:
      layout             : single
      author_profile     : true

  # Teaching
  - scope:
      path               : ""
      type               : teaching
    values:
      layout             : single
      author_profile     : true
      share              : true
      comments           : true

  # Publications
  - scope:
      path               : ""
      type               : publications
    values:
      layout             : single
      author_profile     : true
      share              : true
      comments           : true

  # Portfolio
  - scope:
      path               : ""
      type               : portfolio
    values:
      layout             : single
      author_profile     : true
      share              : true
      comments           : true

  # Talks
  - scope:
      path               : ""
      type               : talks
    values:
      layout             : talk
      author_profile     : true
      share              : true


# Sass / SCSS
sass:
  sass_dir               : _sass
  style                  : compressed


# Output
permalink                : /:categories/:title/

# paginate               : 5
# paginate_path          : /page:num/

timezone                 : Europe/Paris


# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# GitHub Pages Safe-Mode Plugins
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# Archives
category_archive:
  type                   : liquid
  path                   : /categories/

tag_archive:
  type                   : liquid
  path                   : /tags/


# HTML Compression
compress_html:
  clippings              : all

  ignore:
    envs                 : development